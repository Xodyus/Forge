name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_PYTHON: "3.13"

jobs:
  lint-python:
    name: lint-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra dev
      - run: uv run mypy

  unit-python:
    name: unit-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --extra test
      - run: uv run pytest tests/python -v

  build-native:
    name: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset debug -DFORGE_BUILD_BINDINGS=OFF
      - run: cmake --build --preset debug
      - uses: actions/upload-artifact@v4
        with:
          name: forge_cpp_tests
          path: build/debug/forge_cpp_tests
          retention-days: 1

  unit-native:
    name: unit-native
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: cmake --preset debug -DFORGE_BUILD_BINDINGS=OFF
      - run: cmake --build --preset debug
      - run: ctest --preset debug

  smoke:
    name: smoke
    needs: [lint-python, typecheck, unit-python, unit-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: bash scripts/smoke.sh

  # --- Not yet enabled. Each job below is real CI work with a real prerequisite;
  # turning it on before that prerequisite exists would be scope creep ahead of the
  # critical path (§269, CLAUDE.md working agreement).

  # property-smoke:
