  #   partition logic to generate a bounded corpus against (§268 Gate A —
  #   Deterministic reference; §258 property-smoke: "bounded state-machine and
  #   generated corpus").

  # sanitizers:
  #   TODO: enable once forge_cpp has real parsing/aggregation code worth sanitizing,
